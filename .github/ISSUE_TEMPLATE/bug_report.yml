name: Bug Report
description: Create a report to help us fix a bug or unexpected behavior in Yuwbrndr
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve it quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click export at 2x resolution...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open studio at https://techaaroorian.github.io/yuwbrndr/
        2. Select the 'Infographics' preset
        3. Click 'Export PNG'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: The image should export cleanly with all text and badges aligned.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Error Messages
      description: Drag and drop screenshots or paste browser console logs here.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other (specify in description)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - iOS / Android
    validations:
      required: true
